# Reusable Moodle plugin CI workflow.

name: Moodle plugin CI (reusable)

on:
  workflow_call:
    inputs:
      moodle-branches:
        description: 'JSON array of Moodle branches to test, e.g. ["MOODLE_501_STABLE","MOODLE_500_STABLE"]'
        type: string
        default: '["MOODLE_501_STABLE"]'
      php-versions:
        description: 'JSON array of PHP versions to test, e.g. ["8.3","8.4"]'
        type: string
        default: '["8.4"]'
      databases:
        description: 'JSON array of databases to test, e.g. ["mariadb","pgsql"]'
        type: string
        default: '["mariadb"]'
      exclude:
        description: 'JSON array of matrix exclude combinations, same shape as strategy.matrix.exclude'
        type: string
        default: '[]'
      dependent-plugins:
        description: >
          Newline-separated list of extra plugins to install before the plugin under test,
          one `moodle-plugin-ci add-plugin` argument line per plugin, e.g.:
            --branch main StudiUM/moodle-qtype_tcs
            --branch MOODLE_401_STABLE some-org/moodle-mod_foo
        type: string
        default: ''
      phpcs-exclude:
        description: 'Comma separated list of phpcs rules to exclude'
        type: string
        default: 'moodle.Files.BoilerplateComment'
      max-phpcs-warnings:
        type: number
        default: 0
      max-phpdoc-warnings:
        type: number
        default: 0
      max-grunt-lint-warnings:
        type: number
        default: 0
      run-behat:
        description: 'Whether to run the Behat suite'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ${{ fromJSON(inputs.moodle-branches) }}
        php: ${{ fromJSON(inputs.php-versions) }}
        database: ${{ fromJSON(inputs.databases) }}
        exclude: ${{ fromJSON(inputs.exclude) }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          # Add dirs to $PATH
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          # PHPUnit depends on en_AU.UTF-8 locale
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Add dependent plugins
        if: ${{ inputs.dependent-plugins != '' }}
        run: |
          while IFS= read -r plugin; do
            [ -z "$plugin" ] && continue
            moodle-plugin-ci add-plugin $plugin
          done <<< "${{ inputs.dependent-plugins }}"

      - name: Install moodle-plugin-ci
        # Need explicit IP to stop mysql client fail on attempt to use unix socket.
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings ${{ inputs.max-phpcs-warnings }} --exclude ${{ inputs.phpcs-exclude }}

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings ${{ inputs.max-phpdoc-warnings }}

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings ${{ inputs.max-grunt-lint-warnings }}

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning --testdox

      - name: Behat features
        id: behat
        if: ${{ !cancelled() && inputs.run-behat }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

